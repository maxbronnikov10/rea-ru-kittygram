volumes:
  pg_data:
  static:
  media:

services:
  db:
    image: postgres:16-alpine
    env_file: .env
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend/
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - static:/backend_static
      - media:/app/media

  frontend:
    build: ./frontend/
    volumes:
      - static:/frontend_static

  gateway:
    build: ./nginx/
    ports:
      - "${GATEWAY_PORT:-9000}:80"
    depends_on:
      - backend
      - frontend
    volumes:
      - static:/staticfiles
      - media:/media
